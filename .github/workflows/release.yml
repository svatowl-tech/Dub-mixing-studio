name: "Build & Release Dub Mixing Studio"

on:
  push:
    branches:
      - main
      - master
      - 'release/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish immediately (checked = public release, unchecked = draft)'
        type: boolean
        required: false
        default: true
      custom_version:
        description: 'Custom version override (e.g. 1.2.0). Leave empty to use package.json'
        type: string
        required: false
        default: ''

permissions:
  contents: write
  actions: write

jobs:
  # -------------------------------------------------------------
  # Job 1: Resolve Version and Release Metadata
  # -------------------------------------------------------------
  prepare:
    name: Prepare Release Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version_step.outputs.version }}
      tag_name: ${{ steps.version_step.outputs.tag_name }}
      is_tag: ${{ steps.version_step.outputs.is_tag }}
      is_draft: ${{ steps.version_step.outputs.is_draft }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Determine Version
        id: version_step
        run: |
          if [ -n "${{ github.event.inputs.custom_version }}" ]; then
            VERSION="${{ github.event.inputs.custom_version }}"
            node scripts/bump-version.js "$VERSION"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi

          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "${{ github.event.inputs.publish_release }}" = "false" ]; then
            echo "is_draft=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_draft=false" >> "$GITHUB_OUTPUT"
          fi

          echo "Prepared release for Dub Mixing Studio version: $VERSION (Tag: $TAG)"

  # -------------------------------------------------------------
  # Job 2: Cross-Platform Matrix Build
  # -------------------------------------------------------------
  build-binaries:
    name: Build (${{ matrix.platform.name }})
    needs: prepare
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - id: windows
            name: Windows x64 (Setup & Portable)
            os: windows-latest
          - id: macos
            name: macOS (DMG)
            os: macos-latest
          - id: linux
            name: Linux x64 (DEB & AppImage)
            os: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Ubuntu system dependencies for WebKitGTK, Audio APIs, and AppImage packaging
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            patchelf \
            squashfs-tools
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2

      - name: Install NPM Dependencies
        run: npm install

      - name: Generate All Platform Icons
        run: node scripts/generate-icons.js

      - name: Setup FFmpeg & FFprobe Sidecars
        run: node scripts/setup-ffmpeg.js

      # Download and bundle all required neural models (UVR, DeNoise, DeReverb)
      - name: Download & Embed Neural Models
        run: node scripts/download_models.js

      # Setup Embedded AI Python Environment (audio-separator)
      - name: Setup Embedded AI Python Environment
        run: node scripts/setup_embed_py.js

      # Setup ASIO SDK for Windows low-latency audio support
      - name: Checkout ASIO SDK (Windows)
        if: runner.os == 'Windows'
        uses: actions/checkout@v4
        with:
          repository: 'audiosdk/asio'
          path: 'asio-sdk'

      - name: Setup ASIO SDK Environment (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p /c/ASIOSDK
          cp -r asio-sdk/* /c/ASIOSDK/
          echo "CPAL_ASIO_DIR=C:\\ASIOSDK" >> $GITHUB_ENV
          echo "ASIO SDK successfully configured at C:\\ASIOSDK"

      # Build Tauri Application (uses bundle.targets from tauri.conf.json)
      - name: Build Tauri Application
        run: npx tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CPAL_ASIO_DIR: "C:\\ASIOSDK"
          CI: "true"

      # ---------------------------------------------------------
      # Windows Specific: Package NSIS Installer and Portable ZIP
      # ---------------------------------------------------------
      - name: Prepare Windows Artifacts (Installer + Portable)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          mkdir -p dist-artifacts

          # 1. NSIS Setup Installer
          found_installer=false
          for f in src-tauri/target/release/bundle/nsis/*.exe; do
            if [ -f "$f" ]; then
              cp "$f" "dist-artifacts/Dub_Mixing_Studio_${VERSION}_Windows_Setup_x64.exe"
              found_installer=true
              break
            fi
          done
          if [ "$found_installer" = false ]; then
            echo "Warning: NSIS installer exe not found in nsis directory."
          fi

          # 2. Portable Standalone Bundle
          PORTABLE_DIR="dist-artifacts/Dub_Mixing_Studio_${VERSION}_Windows_Portable_x64"
          mkdir -p "$PORTABLE_DIR"
          mkdir -p "$PORTABLE_DIR/bin"

          # Copy main executable
          if [ -f "src-tauri/target/release/dubstudio.exe" ]; then
            cp "src-tauri/target/release/dubstudio.exe" "$PORTABLE_DIR/Dub Mixing Studio.exe"
          fi

          # Copy any runtime DLLs (e.g. onnxruntime.dll, DirectML.dll)
          cp src-tauri/target/release/*.dll "$PORTABLE_DIR/" 2>/dev/null || true

          # Copy sidecars if present
          if [ -d "src-tauri/bin" ]; then
            cp -r src-tauri/bin/* "$PORTABLE_DIR/bin/" 2>/dev/null || true
          fi

          # Copy embedded AI environment if present
          if [ -d "src-tauri/ai_env" ]; then
            cp -r src-tauri/ai_env "$PORTABLE_DIR/" 2>/dev/null || true
          fi

          # Copy neural models if present
          if [ -d "src-tauri/models" ]; then
            cp -r src-tauri/models "$PORTABLE_DIR/" 2>/dev/null || true
          fi
          if [ -d "src-tauri/resources" ]; then
            cp -r src-tauri/resources "$PORTABLE_DIR/" 2>/dev/null || true
          fi

          # Create README for portable edition
          echo "Dub Mixing Studio - Portable Edition" > "$PORTABLE_DIR/README.txt"
          echo "====================================" >> "$PORTABLE_DIR/README.txt"
          echo "Запуск: запустите файл \"Dub Mixing Studio.exe\"." >> "$PORTABLE_DIR/README.txt"
          echo "Данная версия не требует установки в систему и может" >> "$PORTABLE_DIR/README.txt"
          echo "запускаться с любого носителя (включая USB флешки)." >> "$PORTABLE_DIR/README.txt"

          # Compress to ZIP
          cd dist-artifacts
          7z a -tzip "Dub_Mixing_Studio_${VERSION}_Windows_Portable_x64.zip" "Dub_Mixing_Studio_${VERSION}_Windows_Portable_x64"
          rm -rf "Dub_Mixing_Studio_${VERSION}_Windows_Portable_x64"
          cd ..

      # ---------------------------------------------------------
      # macOS Specific: Package DMG
      # ---------------------------------------------------------
      - name: Prepare macOS Artifacts
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          mkdir -p dist-artifacts
          for f in src-tauri/target/release/bundle/dmg/*.dmg; do
            if [ -f "$f" ]; then
              cp "$f" "dist-artifacts/Dub_Mixing_Studio_${VERSION}_macOS.dmg"
              break
            fi
          done

      # ---------------------------------------------------------
      # Linux Specific: Package DEB, AppImage and Portable TAR.GZ
      # ---------------------------------------------------------
      - name: Prepare Linux Artifacts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          mkdir -p dist-artifacts

          # 1. Debian Package
          for f in src-tauri/target/release/bundle/deb/*.deb; do
            if [ -f "$f" ]; then
              cp "$f" "dist-artifacts/dub-mixing-studio_${VERSION}_amd64.deb"
              break
            fi
          done

          # 2. AppImage (Portable Linux)
          for f in src-tauri/target/release/bundle/appimage/*.AppImage; do
            if [ -f "$f" ]; then
              cp "$f" "dist-artifacts/Dub_Mixing_Studio_${VERSION}_Linux_x64.AppImage"
              break
            fi
          done

          # 3. Standalone Portable TAR.GZ
          LINUX_PORTABLE="dist-artifacts/Dub_Mixing_Studio_${VERSION}_Linux_Portable_x64"
          mkdir -p "$LINUX_PORTABLE/bin"
          if [ -f "src-tauri/target/release/dubstudio" ]; then
            cp "src-tauri/target/release/dubstudio" "$LINUX_PORTABLE/dub-mixing-studio"
            chmod +x "$LINUX_PORTABLE/dub-mixing-studio"
          fi
          if [ -d "src-tauri/bin" ]; then
            cp -r src-tauri/bin/* "$LINUX_PORTABLE/bin/" 2>/dev/null || true
          fi
          cd dist-artifacts
          tar -czf "Dub_Mixing_Studio_${VERSION}_Linux_Portable_x64.tar.gz" "Dub_Mixing_Studio_${VERSION}_Linux_Portable_x64"
          rm -rf "Dub_Mixing_Studio_${VERSION}_Linux_Portable_x64"
          cd ..

      - name: Upload Platform Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.platform.id }}
          path: dist-artifacts/*
          if-no-files-found: warn

  # -------------------------------------------------------------
  # Job 3: Aggregate All Artifacts and Publish GitHub Release
  # -------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [prepare, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-release-assets
          pattern: artifacts-*
          merge-multiple: true

      - name: Generate Checksums & Inspect Files
        run: |
          cd all-release-assets
          sha256sum * > SHA256SUMS.txt 2>/dev/null || true
          echo "=== Release Assets Ready for Publication ==="
          ls -lh
          echo "=== SHA256 Checksums ==="
          cat SHA256SUMS.txt
          cd ..

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          name: "Dub Mixing Studio ${{ needs.prepare.outputs.tag_name }}"
          draft: ${{ needs.prepare.outputs.is_draft == 'true' }}
          prerelease: false
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            all-release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
