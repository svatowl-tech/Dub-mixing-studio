<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f111a"/>
      <stop offset="50%" stop-color="#181a28"/>
      <stop offset="100%" stop-color="#090a10"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="sliderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="32" y="32" width="960" height="960" rx="220" ry="220" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <rect x="34" y="34" width="956" height="956" rx="218" ry="218" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-opacity="0.35"/>

  <!-- Waveform Soundbars in Center Background -->
  <g opacity="0.25">
    <rect x="180" y="440" width="16" height="144" rx="8" fill="#6366f1"/>
    <rect x="220" y="380" width="16" height="264" rx="8" fill="#6366f1"/>
    <rect x="260" y="460" width="16" height="104" rx="8" fill="#8b5cf6"/>
    <rect x="748" y="460" width="16" height="104" rx="8" fill="#8b5cf6"/>
    <rect x="788" y="380" width="16" height="264" rx="8" fill="#6366f1"/>
    <rect x="828" y="440" width="16" height="144" rx="8" fill="#6366f1"/>
  </g>

  <!-- Studio Mixer Tracks (3 Track Vertical Lines) -->
  <g>
    <!-- Track 1 (Left) -->
    <rect x="320" y="240" width="16" height="544" rx="8" fill="#2e334a"/>
    <rect x="320" y="380" width="16" height="404" rx="8" fill="url(#cyanGrad)" opacity="0.9"/>
    <!-- Knob 1 -->
    <rect x="276" y="344" width="104" height="64" rx="16" fill="url(#sliderGrad)" filter="url(#glow)"/>
    <rect x="312" y="372" width="32" height="8" rx="4" fill="#0f172a"/>

    <!-- Track 2 (Center - Master/Lead) -->
    <rect x="504" y="200" width="16" height="624" rx="8" fill="#2e334a"/>
    <rect x="504" y="280" width="16" height="544" rx="8" fill="url(#accentGrad)"/>
    <!-- Knob 2 -->
    <rect x="460" y="248" width="104" height="68" rx="16" fill="#ffffff" filter="url(#glow)"/>
    <rect x="496" y="278" width="32" height="8" rx="4" fill="#4f46e5"/>

    <!-- Track 3 (Right) -->
    <rect x="688" y="240" width="16" height="544" rx="8" fill="#2e334a"/>
    <rect x="688" y="480" width="16" height="304" rx="8" fill="url(#accentGrad)" opacity="0.9"/>
    <!-- Knob 3 -->
    <rect x="644" y="448" width="104" height="64" rx="16" fill="url(#sliderGrad)" filter="url(#glow)"/>
    <rect x="680" y="476" width="32" height="8" rx="4" fill="#0f172a"/>
  </g>

  <!-- Microphone & Headphone / Separation Visual Crest (Lower Accent) -->
  <circle cx="512" cy="720" r="28" fill="#6366f1" filter="url(#glow)"/>
  <circle cx="512" cy="720" r="14" fill="#ffffff"/>
</svg>
