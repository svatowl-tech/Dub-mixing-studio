[package]
name = "dubstudio"
version = "1.1.0"
description = "Dub Mixing Studio - Professional Audio Mixing, Dubbing and Source Separation Software"
authors = ["Dub Mixing Studio Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
tauri = { version = "2.11.0", features = ["protocol-asset", "devtools"] }
tauri-plugin-dialog = "^2.0.0"
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam-channel = "0.5"
libloading = "0.8"
walkdir = "2.4"
vst = "0.3"
tokio = { version = "1.0", features = ["process", "rt-multi-thread", "macros"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite"] }
hound = "3.5"
biquad = "0.4.2"
ringbuf = "0.2"
rayon = "1.10.0"
regex = "1.10"
uuid = { version = "1.0", features = ["v4", "serde"] }
base64 = "0.21"
md5 = "0.7"
zip = { version = "0.6.3", default-features = false, features = ["deflate"] }
chrono = "0.4"
ebur128 = "0.1"
rubato = "0.15"
rustfft = "6.2.0"
ndarray = { version = "0.17", features = ["std"] }

[target.'cfg(windows)'.dependencies]
cpal = { version = "0.15", features = ["asio"] }
windows = { version = "0.58", features = ["Win32_System_Com", "Win32_System_Threading", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "download-binaries", "copy-dylibs", "tls-rustls", "directml"] }

[target.'cfg(not(windows))'.dependencies]
cpal = { version = "0.15" }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "download-binaries", "copy-dylibs", "tls-rustls"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
asio = ["cpal/asio"]

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"
